<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Details | SecureLearn</title>
  <meta name="description" content="See what you will learn, the full curriculum and requirements for this SecureLearn course.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/utilities.css">
  <script src="js/theme-init.js"></script>
</head>
<body data-page="course-details" data-nav="courses">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div id="course-root">
      <section class="page-hero">
        <div class="container">
          <ol class="breadcrumbs">
            <li><a href="index.html">Home</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li id="course-crumb">Course</li>
          </ol>
          <div class="row mb-2" id="course-badges"></div>
          <h1 id="course-title">Loading...</h1>
          <p class="lead" id="course-summary"></p>
        </div>
      </section>

      <section class="section">
        <div class="container detail-layout">
          <div>
            <div class="detail-block">
              <h2>About this course</h2>
              <p class="muted" id="course-description"></p>
            </div>

            <div class="detail-block">
              <h2>What you will learn</h2>
              <ul class="check-list" id="course-outcomes"></ul>
            </div>

            <div class="detail-block">
              <h2>Curriculum</h2>
              <div class="accordion" id="course-curriculum"></div>
            </div>

            <div class="detail-block">
              <h2>Requirements</h2>
              <ul class="check-list" id="course-requirements"></ul>
            </div>
          </div>

          <aside class="detail-side">
            <div class="card">
              <h3 class="mt-0">Course details</h3>
              <ul class="facts" id="course-facts"></ul>
              <button class="btn btn-primary btn-block" id="enroll-btn" type="button">Enroll for free</button>
              <p class="field-hint mt-2 mb-0">Demo only. Enrollment is saved in this browser.</p>
            </div>
          </aside>
        </div>
      </section>

      <section class="section section-alt">
        <div class="container">
          <div class="section-head">
            <p class="eyebrow">// keep going</p>
            <h2>Related courses</h2>
          </div>
          <div class="grid grid-3" id="related-courses"></div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/render.js"></script>
  <script src="js/pages/course-details.js"></script>
</body>
</html>
